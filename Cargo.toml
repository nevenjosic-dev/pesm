[package]
name = "pesm"
version = "0.1.3"
edition = "2021"
default-run = "pesm"

[dependencies]
image = { version = "0.24", default-features = false, features = ["png", "tga", "dds", "jpeg"] }
macroquad = { version = "0.4", features = ["audio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
sha2 = "0.11"
toml = "0.8"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
rand = "0.10"
qrcode = { version = "0.15", default-features = false }
local-ip-address = "0.6"
libc = "0.2"
pesm-coaching-zone = { git = "https://github.com/FabianZettl/pesm-coaching-zone", rev = "74c069f" }

[package.metadata.android]
assets = "assets/"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.activity_attributes]
"android:screenOrientation" = "userLandscape"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
incremental = true
lto = "off"
[package.metadata.android.application.activity]
exported = true
