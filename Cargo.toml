[package]
name = "pesm"
version = "0.1.3"
edition = "2021"
default-run = "pesm"

[dependencies]
image = { version = "0.24", default-features = false, features = ["png", "tga", "dds", "jpeg"] }
macroquad = { version = "0.4", features = ["audio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
sha2 = "0.11"
toml = "0.8"
rand = "0.10"

[package.metadata.android]
assets = "assets/"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.activity_attributes]
"android:screenOrientation" = "userLandscape"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
incremental = true
lto = "off"
