name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: notfl3/cargo-apk:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build APK
        run: cargo quad-apk build --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pesm-android-apk
          path: target/android-artifacts/release/apk/*.apk
          
