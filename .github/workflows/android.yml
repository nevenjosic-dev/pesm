name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: notfl3/cargo-apk:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zip and update Rust/cargo-quad-apk
        run: |
          if command -v pacman >/dev/null 2>&1; then
            pacman -Sy --noconfirm zip
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update && apt-get install -y zip
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache zip
          fi
          rustup update stable
          rustup default stable
          rustup target add aarch64-linux-android
          cargo install --git https://github.com/not-fl3/cargo-quad-apk --force

      - name: Build and Sign APK
        run: |
          if [ ! -d /opt/android-sdk-linux/platforms/android-36 ]; then
            EXISTING=$(ls -d /opt/android-sdk-linux/platforms/android-* | sort -V | tail -n 1)
            ln -s "$EXISTING" /opt/android-sdk-linux/platforms/android-36
          fi
          cargo quad-apk build --release --bin pesm

          keytool -genkey -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

          zipalign -f 4 target/android-artifacts/release/apk/pesm.apk \
            target/android-artifacts/release/apk/pesm-aligned.apk

          apksigner sign --ks debug.keystore --ks-pass pass:android \
            --key-pass pass:android \
            --out target/android-artifacts/release/apk/pesm.apk \
            target/android-artifacts/release/apk/pesm-aligned.apk

          rm -f target/android-artifacts/release/apk/pesm-aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pesm-android-apk
          path: target/android-artifacts/release/apk/pesm.apk
